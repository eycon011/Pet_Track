<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PetTrack — Seu Pet, Sempre Seguro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --orange: #f99830;
    --orange-light: #fdb96a;
    --orange-dark: #e07d10;
    --orange-pale: #fff4e3;
    --white: #ffffff;
    --gray-50: #fafafa;
    --gray-100: #f5f5f5;
    --gray-200: #e8e8e8;
    --gray-500: #9e9e9e;
    --gray-700: #4a4a4a;
    --gray-900: #1a1a1a;
    --success: #4caf50;
    --shadow: 0 8px 32px rgba(249,152,48,0.15);
    --shadow-card: 0 4px 20px rgba(0,0,0,0.08);
    --radius: 20px;
    --radius-sm: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--white);
    color: var(--gray-900);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── NAV ─── */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1.5px solid rgba(249,152,48,0.12);
    padding: 0 5%;
    height: 68px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo {
    font-family: 'Baloo 2', cursive;
    font-size: 1.6rem; font-weight: 800;
    color: var(--orange);
    display: flex; align-items: center; gap: 8px;
    cursor: pointer;
  }
  .nav-logo span { font-size: 1.4rem; }
  .nav-links { display: flex; align-items: center; gap: 24px; }
  .nav-links a {
    font-weight: 600; font-size: 0.9rem;
    color: var(--gray-700); text-decoration: none;
    transition: color 0.2s; cursor: pointer;
  }
  .nav-links a:hover { color: var(--orange); }
  .btn {
    padding: 10px 24px; border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700; font-size: 0.9rem;
    cursor: pointer; transition: all 0.2s; border: none;
  }
  .btn-primary {
    background: var(--orange); color: white;
    box-shadow: 0 4px 16px rgba(249,152,48,0.35);
  }
  .btn-primary:hover {
    background: var(--orange-dark);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(249,152,48,0.45);
  }
  .btn-outline {
    background: transparent; color: var(--orange);
    border: 2px solid var(--orange);
  }
  .btn-outline:hover { background: var(--orange-pale); }
  .btn-lg { padding: 14px 36px; font-size: 1rem; }
  .btn-sm { padding: 8px 18px; font-size: 0.82rem; }

  /* ─── HERO ─── */
  .hero {
    min-height: 100vh;
    padding: 120px 5% 80px;
    display: flex; align-items: center;
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #fff 0%, var(--orange-pale) 100%);
  }
  .hero-bg {
    position: absolute; inset: 0;
    pointer-events: none; overflow: hidden;
  }
  .hero-bg svg {
    position: absolute;
    opacity: 0.07;
  }
  .hero-content {
    position: relative; z-index: 2;
    max-width: 600px;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: white; border: 2px solid var(--orange);
    border-radius: 50px; padding: 6px 16px;
    font-size: 0.82rem; font-weight: 700; color: var(--orange);
    margin-bottom: 28px;
    animation: fadeUp 0.6s ease both;
  }
  .hero h1 {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(2.5rem, 5vw, 3.8rem);
    font-weight: 800; line-height: 1.15;
    color: var(--gray-900);
    margin-bottom: 20px;
    animation: fadeUp 0.7s 0.1s ease both;
  }
  .hero h1 span { color: var(--orange); }
  .hero p {
    font-size: 1.05rem; color: var(--gray-700);
    line-height: 1.7; margin-bottom: 36px;
    animation: fadeUp 0.7s 0.2s ease both;
    max-width: 480px;
  }
  .hero-btns {
    display: flex; gap: 16px; flex-wrap: wrap;
    animation: fadeUp 0.7s 0.3s ease both;
  }
  .hero-visual {
    position: absolute; right: 5%; top: 50%;
    transform: translateY(-50%);
    width: min(420px, 45vw);
    display: flex; justify-content: center; align-items: center;
    animation: floatIn 0.9s 0.2s ease both;
  }
  .hero-card {
    background: white;
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow), 0 0 0 1px rgba(249,152,48,0.1);
    width: 100%;
  }
  .hero-card-header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 20px;
  }
  .pet-avatar {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--orange-pale);
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem;
    border: 3px solid var(--orange);
  }
  .hero-stats {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-top: 16px;
  }
  .stat-box {
    background: var(--orange-pale);
    border-radius: var(--radius-sm);
    padding: 14px;
    text-align: center;
  }
  .stat-box .num {
    font-family: 'Baloo 2', cursive;
    font-size: 1.6rem; font-weight: 800;
    color: var(--orange); display: block;
  }
  .stat-box .lbl {
    font-size: 0.75rem; color: var(--gray-700); font-weight: 600;
  }

  /* ─── SECTIONS ─── */
  .section { padding: 80px 5%; }
  .section-center { text-align: center; }
  .section-title {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1.8rem, 3vw, 2.6rem);
    font-weight: 800; color: var(--gray-900);
    margin-bottom: 12px;
  }
  .section-title span { color: var(--orange); }
  .section-sub {
    font-size: 1rem; color: var(--gray-500);
    max-width: 520px; margin: 0 auto 48px;
    line-height: 1.7;
  }

  /* ─── FEATURES ─── */
  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
  }
  .feature-card {
    background: white;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 28px;
    transition: all 0.3s;
    position: relative; overflow: hidden;
  }
  .feature-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--orange), var(--orange-light));
    opacity: 0; transition: opacity 0.3s;
  }
  .feature-card:hover {
    border-color: var(--orange);
    transform: translateY(-4px);
    box-shadow: var(--shadow);
  }
  .feature-card:hover::before { opacity: 1; }
  .feature-icon {
    width: 52px; height: 52px;
    background: var(--orange-pale);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; margin-bottom: 18px;
  }
  .feature-card h3 {
    font-family: 'Baloo 2', cursive;
    font-size: 1.15rem; font-weight: 700;
    margin-bottom: 8px; color: var(--gray-900);
  }
  .feature-card p { font-size: 0.88rem; color: var(--gray-500); line-height: 1.6; }
  .badge-premium {
    display: inline-block; background: var(--orange);
    color: white; font-size: 0.68rem; font-weight: 800;
    padding: 2px 8px; border-radius: 50px;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-left: 8px; vertical-align: middle;
  }

  /* ─── PRICING ─── */
  .pricing-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 28px; max-width: 700px; margin: 0 auto;
  }
  .price-card {
    border-radius: var(--radius);
    padding: 36px 28px;
    border: 2px solid var(--gray-200);
    position: relative; transition: all 0.3s;
  }
  .price-card.featured {
    border-color: var(--orange);
    box-shadow: var(--shadow);
    background: white;
  }
  .price-badge {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    background: var(--orange); color: white;
    font-size: 0.75rem; font-weight: 800;
    padding: 4px 16px; border-radius: 50px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .price-name {
    font-family: 'Baloo 2', cursive;
    font-size: 1.2rem; font-weight: 700;
    color: var(--gray-700); margin-bottom: 4px;
  }
  .price-val {
    font-family: 'Baloo 2', cursive;
    font-size: 2.6rem; font-weight: 800;
    color: var(--orange); line-height: 1;
  }
  .price-val sup { font-size: 1rem; vertical-align: top; margin-top: 10px; display: inline-block; }
  .price-val sub { font-size: 0.9rem; color: var(--gray-500); }
  .price-list { list-style: none; margin: 24px 0; }
  .price-list li {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.9rem; padding: 7px 0;
    border-bottom: 1px solid var(--gray-100);
    color: var(--gray-700);
  }
  .price-list li span.check { color: var(--success); font-size: 1rem; }
  .price-list li span.x { color: var(--gray-300); }

  /* ─── APP SCREENS / MODALS ─── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    animation: fadeIn 0.2s ease;
  }
  .modal {
    background: white; border-radius: var(--radius);
    padding: 36px; width: 100%; max-width: 440px;
    max-height: 90vh; overflow-y: auto;
    animation: slideUp 0.3s ease;
    position: relative;
  }
  .modal-title {
    font-family: 'Baloo 2', cursive;
    font-size: 1.6rem; font-weight: 800;
    color: var(--gray-900); margin-bottom: 4px;
  }
  .modal-sub { font-size: 0.88rem; color: var(--gray-500); margin-bottom: 28px; }
  .form-group { margin-bottom: 18px; }
  .form-label {
    display: block; font-size: 0.82rem; font-weight: 700;
    color: var(--gray-700); margin-bottom: 6px;
  }
  .form-input {
    width: 100%; padding: 12px 16px;
    border: 2px solid var(--gray-200);
    border-radius: var(--radius-sm);
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem; color: var(--gray-900);
    transition: border-color 0.2s; outline: none;
    background: var(--gray-50);
  }
  .form-input:focus { border-color: var(--orange); background: white; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .close-btn {
    position: absolute; top: 16px; right: 16px;
    background: var(--gray-100); border: none;
    border-radius: 50%; width: 32px; height: 32px;
    font-size: 1.1rem; cursor: pointer; color: var(--gray-700);
    display: flex; align-items: center; justify-content: center;
  }

  /* ─── DASHBOARD ─── */
  .dashboard {
    min-height: 100vh;
    padding: 88px 5% 40px;
    background: var(--gray-50);
  }
  .dash-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 32px; flex-wrap: wrap; gap: 16px;
  }
  .dash-title {
    font-family: 'Baloo 2', cursive;
    font-size: 1.8rem; font-weight: 800; color: var(--gray-900);
  }
  .dash-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
  }
  .dash-card {
    background: white; border-radius: var(--radius);
    padding: 24px; box-shadow: var(--shadow-card);
    border: 1.5px solid var(--gray-100);
  }
  .dash-card-title {
    font-family: 'Baloo 2', cursive;
    font-size: 1rem; font-weight: 700;
    color: var(--gray-700); margin-bottom: 18px;
    display: flex; align-items: center; gap: 8px;
  }

  /* ─── QR CODE display ─── */
  .qr-container {
    display: flex; flex-direction: column; align-items: center;
    gap: 16px;
  }
  .qr-img {
    width: 180px; height: 180px;
    border-radius: 16px;
    border: 3px solid var(--orange);
    padding: 8px; background: white;
    object-fit: contain;
  }
  .qr-placeholder {
    width: 180px; height: 180px;
    border-radius: 16px;
    border: 3px dashed var(--orange);
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; background: var(--orange-pale);
  }

  /* ─── TRACKER MAP MOCK ─── */
  .tracker-map {
    width: 100%; height: 220px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .tracker-map-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  .tracker-dot {
    width: 20px; height: 20px;
    background: var(--orange);
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 0 0 6px rgba(249,152,48,0.25);
    position: relative; z-index: 2;
    animation: pulse 2s infinite;
  }
  .tracker-label {
    position: absolute; bottom: 12px; left: 12px;
    background: white; border-radius: 8px;
    padding: 6px 12px; font-size: 0.78rem; font-weight: 700;
    color: var(--gray-700);
    box-shadow: var(--shadow-card);
  }

  /* ─── DELIVERY TRACKER ─── */
  .delivery-steps { display: flex; flex-direction: column; gap: 0; }
  .delivery-step {
    display: flex; gap: 16px; padding: 14px 0;
    position: relative;
  }
  .delivery-step:not(:last-child)::after {
    content: '';
    position: absolute; left: 17px; top: 42px;
    width: 2px; height: calc(100% - 28px);
    background: var(--gray-200);
  }
  .delivery-step.done::after { background: var(--success); }
  .step-circle {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--gray-200);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; flex-shrink: 0; z-index: 1;
    transition: all 0.4s;
  }
  .delivery-step.done .step-circle {
    background: var(--success); color: white;
  }
  .delivery-step.active .step-circle {
    background: var(--orange); color: white;
    animation: pulse 2s infinite;
  }
  .step-info { padding-top: 6px; }
  .step-name { font-weight: 700; font-size: 0.9rem; color: var(--gray-900); }
  .step-time { font-size: 0.78rem; color: var(--gray-500); margin-top: 2px; }

  /* ─── AI CHAT ─── */
  .ai-chat {
    display: flex; flex-direction: column;
    height: 100%;
  }
  .chat-messages {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px;
    padding: 4px 0; max-height: 280px;
  }
  .chat-bubble {
    padding: 10px 16px; border-radius: 16px;
    max-width: 85%; font-size: 0.875rem; line-height: 1.5;
  }
  .chat-bubble.bot {
    background: var(--orange-pale);
    color: var(--gray-900);
    border-bottom-left-radius: 4px;
    align-self: flex-start;
  }
  .chat-bubble.user {
    background: var(--orange); color: white;
    border-bottom-right-radius: 4px;
    align-self: flex-end;
  }
  .chat-input-row {
    display: flex; gap: 10px; margin-top: 14px;
  }
  .chat-input {
    flex: 1; padding: 10px 16px;
    border: 2px solid var(--gray-200);
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem; outline: none;
    transition: border-color 0.2s;
  }
  .chat-input:focus { border-color: var(--orange); }
  .chat-send {
    width: 40px; height: 40px;
    background: var(--orange); border: none;
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; color: white; transition: all 0.2s;
  }
  .chat-send:hover { background: var(--orange-dark); transform: scale(1.05); }

  /* ─── PUBLIC PROFILE (QR landing) ─── */
  .profile-page {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--orange-pale) 0%, white 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .profile-card {
    background: white; border-radius: 28px;
    padding: 40px 32px;
    box-shadow: 0 20px 60px rgba(249,152,48,0.2);
    width: 100%; max-width: 400px;
    text-align: center;
    border: 2px solid rgba(249,152,48,0.15);
  }
  .profile-pet-emoji {
    font-size: 4rem; margin-bottom: 8px;
    filter: drop-shadow(0 4px 12px rgba(249,152,48,0.3));
  }
  .profile-pet-name {
    font-family: 'Baloo 2', cursive;
    font-size: 1.8rem; font-weight: 800; color: var(--gray-900);
  }
  .profile-alert {
    background: #fff3cd; border: 2px solid #f99830;
    border-radius: 14px; padding: 14px;
    margin: 20px 0; font-size: 0.88rem;
    font-weight: 600; color: #7d5200;
    display: flex; align-items: center; gap: 10px;
  }
  .profile-info-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--gray-100);
    text-align: left;
  }
  .profile-info-icon {
    width: 36px; height: 36px;
    background: var(--orange-pale); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; flex-shrink: 0;
  }
  .contact-btn {
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    background: var(--orange); color: white;
    border: none; border-radius: 50px;
    padding: 16px 32px; width: 100%;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem; font-weight: 700;
    cursor: pointer; margin-top: 20px;
    transition: all 0.2s;
    text-decoration: none;
    box-shadow: 0 6px 20px rgba(249,152,48,0.4);
  }
  .contact-btn:hover { background: var(--orange-dark); transform: translateY(-2px); }

  /* ─── PLAN BADGE ─── */
  .plan-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 14px; border-radius: 50px;
    font-size: 0.78rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .plan-pill.free { background: var(--gray-100); color: var(--gray-700); }
  .plan-pill.premium { background: var(--orange); color: white; }

  /* ─── SECTION WAVE ─── */
  .wave-divider { overflow: hidden; line-height: 0; }
  .wave-divider svg { display: block; }

  /* ─── HOW IT WORKS ─── */
  .steps-row {
    display: flex; justify-content: center;
    gap: 0; flex-wrap: wrap; margin: 0 auto;
    max-width: 900px; position: relative;
  }
  .how-step {
    flex: 1; min-width: 200px; text-align: center;
    padding: 0 20px; position: relative;
  }
  .how-step:not(:last-child)::after {
    content: '→';
    position: absolute; right: -10px; top: 24px;
    font-size: 1.4rem; color: var(--orange-light);
  }
  .step-num {
    width: 52px; height: 52px;
    background: var(--orange); color: white;
    border-radius: 50%;
    font-family: 'Baloo 2', cursive;
    font-size: 1.3rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
  }
  .how-step h4 {
    font-family: 'Baloo 2', cursive;
    font-size: 1rem; font-weight: 700;
    margin-bottom: 8px; color: var(--gray-900);
  }
  .how-step p { font-size: 0.83rem; color: var(--gray-500); line-height: 1.5; }

  /* ─── FOOTER ─── */
  .footer {
    background: var(--gray-900); color: white;
    padding: 48px 5% 28px;
  }
  .footer-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 32px; margin-bottom: 36px;
  }
  .footer-logo {
    font-family: 'Baloo 2', cursive;
    font-size: 1.5rem; font-weight: 800; color: var(--orange);
    margin-bottom: 10px;
  }
  .footer-desc { font-size: 0.85rem; color: #888; line-height: 1.6; }
  .footer-title { font-weight: 700; font-size: 0.85rem; color: #ccc; margin-bottom: 14px; }
  .footer-links { list-style: none; }
  .footer-links li { margin-bottom: 8px; }
  .footer-links a { color: #888; font-size: 0.83rem; text-decoration: none; cursor: pointer; }
  .footer-links a:hover { color: var(--orange); }
  .footer-bottom {
    border-top: 1px solid #333; padding-top: 20px;
    font-size: 0.78rem; color: #666; text-align: center;
  }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes slideUp {

const { useState, useEffect, useRef } = React;

// ─── API Service ──────────────────────────────────────────────────────────────
const API_BASE = "http://localhost:8000";

const api = {
  async post(path, body, token) {
    const res = await fetch(API_BASE + path, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        ...(token ? { Authorization: `Bearer ${token}` } : {})
      },
      body: JSON.stringify(body)
    });
    return res.json();
  },
  async get(path, token) {
    const res = await fetch(API_BASE + path, {
      headers: token ? { Authorization: `Bearer ${token}` } : {}
    });
    return res.json();
  }
};

// ─── Auth Context ─────────────────────────────────────────────────────────────
const AuthContext = React.createContext(null);

function useAuth() { return React.useContext(AuthContext); }

function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [token, setToken] = useState(null);

  useEffect(() => {
    const savedToken = localStorage.getItem("pt_token");
    const savedUser = localStorage.getItem("pt_user");
    if (savedToken && savedUser) {
      setToken(savedToken);
      setUser(JSON.parse(savedUser));
    }
  }, []);

  const login = (userData, tok) => {
    setUser(userData);
    setToken(tok);
    localStorage.setItem("pt_token", tok);
    localStorage.setItem("pt_user", JSON.stringify(userData));
  };

  const logout = () => {
    setUser(null);
    setToken(null);
    localStorage.removeItem("pt_token");
    localStorage.removeItem("pt_user");
  };

  return (
    <AuthContext.Provider value={{ user, token, login, logout }}>
      {children}
    </AuthContext.Provider>
  );
}

// ─── ADD PET MODAL ────────────────────────────────────────────────────────────
function AddPetModal({ onClose, onAdd, token }) {
  const [form, setForm] = useState({ name: "", species: "Cachorro", breed: "", age: "", color: "" });
  const [loading, setLoading] = useState(false);

  const handleAdd = async () => {
    setLoading(true);
    try {
      const res = await api.post("/pets", { ...form, age: parseInt(form.age) || null }, token);
      if (res.pet_id) {
        onAdd({ id: res.pet_id, ...form, qr_token: res.qr_token });
      } else {
        // Demo mode - add locally
        onAdd({ id: Date.now().toString(), ...form, qr_token: Math.random().toString(36).slice(2) });
      }
    } catch {
      onAdd({ id: Date.now().toString(), ...form, qr_token: Math.random().toString(36).slice(2) });
    }
    setLoading(false);
  };

  const f = k => e => setForm({...form, [k]: e.target.value});

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <button className="close-btn" onClick={onClose}>✕</button>
        <div className="modal-title">Adicionar Pet</div>
        <div className="modal-sub">Cadastre as informações do seu pet</div>
        <div className="form-group">
          <label className="form-label">Nome do Pet *</label>
          <input className="form-input" placeholder="Ex: Mel, Thor, Luna" value={form.name} onChange={f("name")}/>
        </div>
        <div className="form-row">
          <div className="form-group">
            <label className="form-label">Espécie</label>
            <select className="form-input" value={form.species} onChange={f("species")}>
              <option>Cachorro</option>
              <option>Gato</option>
              <option>Outro</option>
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Raça</label>
            <input className="form-input" placeholder="Golden Retriever" value={form.breed} onChange={f("breed")}/>
          </div>
        </div>
        <div className="form-row">
          <div className="form-group">
            <label className="form-label">Idade (anos)</label>
            <input className="form-input" type="number" placeholder="3" value={form.age} onChange={f("age")}/>
          </div>
          <div className="form-group">
            <label className="form-label">Cor / Pelagem</label>
            <input className="form-input" placeholder="Dourado" value={form.color} onChange={f("color")}/>
          </div>
        </div>
        <button className="btn btn-primary" style={{width:"100%",padding:"14px"}} onClick={handleAdd} disabled={loading || !form.name}>
          {loading ? "Cadastrando..." : "🐾 Cadastrar Pet e Gerar QR Code"}
        </button>
      </div>
    </div>
  );
}

  const canvasRef = useRef(null);

  useEffect(() => {
    // Simple QR-like visual using canvas
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const size = 180;
    canvas.width = size; canvas.height = size;

    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, size, size);

    // Draw QR pattern simulation
    const cellSize = 9;
    const cols = Math.floor(size / cellSize);
    ctx.fillStyle = "#f99830";

    // Corner markers
    const drawMarker = (x, y) => {
      ctx.fillStyle = "#f99830";
      ctx.fillRect(x, y, cellSize*7, cellSize*7);
      ctx.fillStyle = "white";
      ctx.fillRect(x+cellSize, y+cellSize, cellSize*5, cellSize*5);
      ctx.fillStyle = "#f99830";
      ctx.fillRect(x+cellSize*2, y+cellSize*2, cellSize*3, cellSize*3);
    };
    drawMarker(cellSize, cellSize);
    drawMarker(size-cellSize*8, cellSize);
    drawMarker(cellSize, size-cellSize*8);

    // Random data cells
    const seed = url.split("").reduce((a,c) => a + c.charCodeAt(0), 0);
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < cols; j++) {
        if ((i < 9 && j < 9) || (i > cols-10 && j < 9) || (i < 9 && j > cols-10)) continue;
        const val = ((seed * (i+1) * (j+1) * 7919) % 100);
        if (val > 45) {
          ctx.fillStyle = val > 70 ? "#f99830" : "#fdb96a";
          ctx.fillRect(i*cellSize+2, j*cellSize+2, cellSize-2, cellSize-2);
        }
      }
    }

    // Logo in center
    ctx.fillStyle = "white";
    ctx.fillRect(size/2-18, size/2-18, 36, 36);
    ctx.font = "22px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🐾", size/2, size/2);
  }, [url]);

  return <canvas ref={canvasRef} style={{borderRadius:"12px",border:"3px solid var(--orange)"}}/>;
}

// ─── APP ROUTER ───────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState("home");
  const [qrToken, setQrToken] = useState(null);

  // Check for QR route
  useEffect(() => {
    const hash = window.location.hash;
    if (hash.startsWith("#/encontrei/")) {
      const token = hash.replace("#/encontrei/", "");
      setQrToken(token);
      setPage("profile");
    }
  }, []);

  // Special routes without nav
  if (page === "profile") {
    return (
      <AuthProvider>
        <PublicProfilePage qrToken={qrToken} setPage={setPage}/>
      </AuthProvider>
    );
  }

  return (
    <AuthProvider>
      <AppWithNav page={page} setPage={setPage}/>
    </AuthProvider>
  );
}

function AppWithNav({ page, setPage }) {
  const nav = <NavBar page={page} setPage={setPage}/>;

  return (
    <>
      {nav}
      {page === "home" && <HomePage setPage={setPage}/>}
      {page === "login" && <LoginPage setPage={setPage}/>}
      {page === "register" && <RegisterPage setPage={setPage}/>}
      {page === "subscribe" && <SubscribePage setPage={setPage}/>}
      {page === "dashboard" && <Dashboard setPage={setPage}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
